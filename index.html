<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONİX | Profilim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Arka plan animasyonu */
        body { 
            margin: 0; padding: 0; 
            background: linear-gradient(270deg, #000000, #0a0a0a, #001a00);
            background-size: 600% 600%;
            animation: hackerBackground 10s ease infinite;
            color: white; font-family: 'Courier New', Courier, monospace;
        }
        @keyframes hackerBackground {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }
        .btn { 
            display: flex; align-items: center; justify-content: center;
            width: 90%; max-width: 400px; padding: 16px; margin-bottom: 15px;
            border-radius: 10px; font-weight: bold; font-size: 18px;
            transition: 0.3s; border: 1px solid #00ff41;
            background: rgba(0, 0, 0, 0.6);
        }
        .btn:hover { background: #00ff41; color: black; }
        .profile-img { width: 150px; height: 150px; border-radius: 50%; border: 3px solid #00ff41; object-fit: cover; box-shadow: 0 0 20px #00ff41; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-5" onclick="startAudio()">

    <img src="https://i.imgur.com/7g4P8nK.png" alt="Profil" class="profile-img mb-6">
    <h1 class="text-4xl font-bold mb-8 text-green-500 tracking-widest">SONİX</h1>

    <audio id="myAudio" loop>
        <source src="https://files.catbox.moe/u0152j.mp3" type="audio/mpeg">
    </audio>

    <a href="https://instagram.com/@sshack_sonix" target="_blank" class="btn text-pink-500">Instagram</a>
    <a href="https://tiktok.com/axaaxxsx5_" target="_blank" class="btn text-white">TikTok</a>
    <a href="https://t.me/sonixHACK" target="_blank" class="btn text-blue-500">Telegram</a>

    <script>
        // Sayfaya herhangi bir yere dokunulduğunda müzik başlar
        function startAudio() {
            var audio = document.getElementById("myAudio");
            audio.play();
        }
    </script>
</body>
</html>
