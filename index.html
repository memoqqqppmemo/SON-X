<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONİX | Profilim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: #000; color: #fff; font-family: 'Courier New', monospace;
            overflow-x: hidden;
        }
        /* Arka Plan Animasyonu (Matrix Tarzı) */
        .bg-animate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #000, #0a0a0a, #001a00);
            z-index: -1;
        }
        .profile-img { 
            width: 140px; height: 140px; border-radius: 50%; 
            border: 2px solid #00ff41; box-shadow: 0 0 20px #00ff41;
            transition: 0.5s;
        }
        .profile-img:hover { transform: scale(1.1); box-shadow: 0 0 30px #00ff41; }
        .btn { 
            width: 80%; max-width: 350px; padding: 15px; margin: 10px 0;
            background: rgba(255, 255, 255, 0.05); border: 1px solid #333;
            border-radius: 8px; text-align: center; font-weight: bold;
            transition: 0.3s; backdrop-filter: blur(5px);
        }
        .btn:hover { background: rgba(0, 255, 65, 0.2); border-color: #00ff41; color: #00ff41; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">

    <div class="bg-animate"></div>

    <img src="https://i.imgur.com/7g4P8nK.png" class="profile-img mb-6">
    <h1 class="text-3xl font-bold mb-8 text-green-500">SONİX</h1>

    <audio id="myAudio" loop>
        <source src="https://files.catbox.moe/u0152j.mp3" type="audio/mpeg">
    </audio>

    <a href="https://instagram.com/@sshack_sonix" target="_blank" class="btn">INSTAGRAM</a>
    <a href="https://tiktok.com/axaaxxsx5_" target="_blank" class="btn">TIKTOK</a>
    <a href="https://t.me/sonixHACK" target="_blank" class="btn">TELEGRAM</a>

    <script>
        // Sayfaya tıklayınca müzik başlasın
        document.body.addEventListener('click', () => {
            document.getElementById('myAudio').play();
        }, { once: true });
    </script>
</body>
</html>
