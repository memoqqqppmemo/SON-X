<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONİX | Mehmet SS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2ff;
            --bg: #050505;
            --card-bg: #111;
            --text: #ffffff;
            --insta: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --tiktok: #000000;
            --telegram: #0088cc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #111 0%, #050505 100%);
            z-index: -1;
        }

        /* --- HERO SECTION --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .profile-img {
            width: 150px; height: 150px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: 0 0 25px var(--accent);
            margin-bottom: 25px;
            object-fit: cover;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px var(--accent); }
            50% { box-shadow: 0 0 30px var(--accent); }
            100% { box-shadow: 0 0 10px var(--accent); }
        }

        .hero h1 { font-size: 3.5rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 5px; }
        .hero p { font-size: 1.1rem; color: #888; margin-bottom: 30px; letter-spacing: 2px; }

        /* --- SOSYAL MEDYA BUTONLARI --- */
        .socials {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }

        .social-link {
            text-decoration: none;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            transition: 0.3s;
            text-align: center;
            display: block;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .insta-btn { background: var(--insta); }
        .tiktok-btn { background: var(--tiktok); border-color: #ff0050; box-shadow: -2px -2px 0px #ff0050, 2px 2px 0px #00f2ff; }
        .tele-btn { background: var(--telegram); }

        .social-link:hover { transform: scale(1.05); filter: brightness(1.2); }

        /* --- KONTEYNER --- */
        .container { max-width: 800px; margin: 0 auto; padding: 60px 20px; }
        .section-title { font-size: 1.8rem; margin-bottom: 30px; text-align: center; color: var(--accent); }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #222;
        }
        .card h3 { margin-bottom: 10px; color: var(--accent); }
        .card p { color: #888; font-size: 0.9rem; }

        footer { text-align: center; padding: 40px; color: #333; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <section class="hero">
        <img src="https://i.ibb.co/xSWc9JWM/mehmet.jpg" alt="SONİX" class="profile-img">
        
        <h1>SONİX</h1>
        <p>@mehmet_ss47</p>
        
        <div class="socials">
            <a href="https://www.instagram.com/mehmet_ss47/" target="_blank" class="social-link insta-btn">Instagram</a>
            <a href="https://www.tiktok.com/@sonixhack7?_r=1&_t=ZS-96BijxKZqsR" target="_blank" class="social-link tiktok-btn">TikTok</a>
            <a href="https://t.me/ss1sonix" target="_blank" class="social-link tele-btn">Telegram</a>
        </div>
    </section>

    <div class="container">
        <h2 class="section-title">Neler Yapıyorum?</h2>
        <div class="grid">
            <div class="card">
                <h3>Yazılım & Termux</h3>
                <p>Python ve otomasyon araçları üzerine çalışmalar geliştiriyorum.</p>
            </div>
            <div class="card">
                <h3>Dijital Güvenlik</h3>
                <p>Ağ analizleri ve siber güvenlik simülasyonları ile ilgileniyorum.</p>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 SONİX (Mehmet SS). Tüm Hakları Saklıdır.
    </footer>

</body>
</html>
